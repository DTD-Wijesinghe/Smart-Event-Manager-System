  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-art{display:flex;flex-direction:column;justify-content:center}
    .auth-art .eyebrow,.auth-art h1,.auth-art p{text-align:center;margin-left:auto;margin-right:auto}
    .auth-art h1{max-width:720px}
    .auth-art p{max-width:560px}
    .auth-proof{left:0;right:0;justify-content:center}
    .auth-card{align-self:center}
    .auth-tabs{justify-content:center}
    .auth-form h2,.auth-form>p{text-align:center}
    .auth-form>small{max-width:380px;margin-left:auto;margin-right:auto}
    @media(max-width:760px){.auth-art{display:block;text-align:center}.auth-art .auth-proof{position:static;margin-top:28px}.auth-card{align-self:stretch}}
    .capture-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}.capture-card{padding:24px}.capture-card-top{display:flex;justify-content:space-between;gap:18px}.capture-card h2{margin:8px 0}.capture-card p{color:var(--muted);line-height:1.6}.capture-icon{display:inline-flex;width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--lime);align-items:center;justify-content:center;font-size:20px}.capture-status{color:var(--purple);font-size:12px;font-weight:800;text-transform:uppercase}.capture-controls,.capture-form-row{display:flex;gap:10px;align-items:center;margin-top:20px}.capture-meter{height:76px;display:flex;gap:5px;align-items:center;margin:24px 0}.capture-meter span{flex:1;background:linear-gradient(180deg,var(--purple),var(--cyan));border-radius:5px;min-height:12px;animation:capturePulse 1.3s ease-in-out infinite alternate}.capture-meter span:nth-child(2n){height:45%}.capture-meter span:nth-child(3n){height:85%}.capture-meter span:nth-child(4n){height:30%}.capture-meter span:nth-child(5n){height:65%}@keyframes capturePulse{to{transform:scaleY(.55);opacity:.65}}.upload-form{display:grid;gap:12px;margin-top:20px}.upload-drop{min-height:130px;border:1px dashed rgba(27,28,45,.25);border-radius:14px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer}.upload-drop input{display:none}.upload-drop strong{display:block}.upload-drop span{color:var(--muted);font-size:12px}.capture-text-card textarea{width:100%;resize:vertical;margin:0 0 12px}.capture-form-row input,.capture-form-row select{flex:1}.capture-form-row .btn{white-space:nowrap}@media(max-width:800px){.capture-grid{grid-template-columns:1fr}.capture-form-row{flex-wrap:wrap}.capture-form-row input,.capture-form-row select,.capture-form-row .btn{width:100%;flex:1 1 100%}}
    .attendee-interactions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:26px auto;max-width:1180px}.attendee-interaction-card{background:#fff;border:1px solid rgba(27,28,45,.12);border-radius:18px;padding:22px;box-shadow:0 12px 30px rgba(27,28,45,.08)}.attendee-interaction-card h2{margin:7px 0}.attendee-interaction-card p{color:var(--muted)}.attendee-interaction-card textarea,.attendee-interaction-card select{width:100%;margin:8px 0 14px}.check-row{display:flex;gap:8px;align-items:center;font-size:12px;margin:4px 0 14px}.rating-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rating-row label{font-size:12px;font-weight:800}.rating-row select{display:block}.attendee-interaction-card .btn{margin-top:4px}@media(max-width:800px){.attendee-interactions{grid-template-columns:1fr}.rating-row{grid-template-columns:1fr}}
  </style>
</head>
