services:
  - type: web
    name: smart-event-manager-system
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_PORT
        value: 10000
      - key: API_PREFIX
        value: /api
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: GCP_LOCATION
        value: global
      - key: VERTEX_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCP_PROJECT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BATCH_MODEL
        value: gemini-3.5-transcribe-preview
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-preview
      - key: EMBEDDING_PROVIDER
        value: local
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: '256'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: event-media
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Eventora Global
      - key: BREVO_VERIFICATION_EXPIRY_MINUTES
        value: '15'
